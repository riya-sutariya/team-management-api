services:
  db:
    image: postgres:16
    container_name: team_management_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: team_management
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d team_management"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: team_management_api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SECRET_KEY: ${SECRET_KEY}
      DATABASE_URL: postgresql://postgres:postgres@db:5432/team_management
    ports:
      - "8000:8000"

volumes:
  postgres_data: